name: dtn-a1

x-dtn-imaj: &dtn-imaj
  image: earth-mars-dtn
  build:
    context: .
    dockerfile: dtn_yapilandirma/Dockerfile

services:
  dunya-a1:
    <<: *dtn-imaj
    container_name: dunya-a1
    hostname: dunya
    volumes:
      - "./:/proje"
    networks:
      a1_link:
        ipv4_address: 10.0.3.2
    command:
      - ud3tn
      - --node-id
      - dtn://dunya.dtn/
      - --aap2-host
      - 127.0.0.1
      - --aap2-port
      - "4242"
      - --lifetime
      - "900"
      - --log-level
      - "3"
      - --cla
      - "sqlite:file::memory:?cache=shared;mtcp:*,4224"

  arac-a1:
    <<: *dtn-imaj
    container_name: arac-a1
    hostname: arac
    volumes:
      - "./:/proje"
    networks:
      a1_link:
        ipv4_address: 10.0.3.3
    command:
      - ud3tn
      - --node-id
      - dtn://arac.dtn/
      - --aap2-host
      - 127.0.0.1
      - --aap2-port
      - "4242"
      - --lifetime
      - "900"
      - --log-level
      - "3"
      - --cla
      - "sqlite:file::memory:?cache=shared;mtcp:*,4226"

networks:
  a1_link:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.3.0/24
